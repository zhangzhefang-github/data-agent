space:
  id: sales
  name: 销售分析
  description: 企业销售经营数据分析
  models:
    sales_summary:
      table: sales_summary
      date_column: stat_date
      columns: [stat_date, city, store_id, product, sales_amount, order_count]
  metrics:
    sales_amount:
      name: 销售额
      model: sales_summary
      expression: SUM(sales_amount)
      grain: [stat_date, store, product]
      allowed_filters: [stat_date, city, store, product]
      description: 人民币净销售额
      synonyms: [销售金额, 净销售额]
    order_count:
      name: 订单量
      model: sales_summary
      expression: SUM(order_count)
      grain: [stat_date, store, product]
      allowed_filters: [stat_date, city, store, product]
      description: 有效订单数
    average_order_value:
      name: 客单价
      model: sales_summary
      numerator: sales_amount
      denominator: order_count
      grain: [stat_date, store, product]
      allowed_filters: [stat_date, city, store, product]
      description: 汇总销售额除以汇总订单量
  dimensions:
    stat_date:
      name: 业务日期
      model: sales_summary
      column: stat_date
    store:
      name: 门店
      model: sales_summary
      column: store_id
    product:
      name: 产品
      model: sales_summary
      column: product
    city:
      name: 城市
      model: sales_summary
      column: city
      synonyms: [地区]
  instructions: 销售额为扣除退款的人民币净销售额
  sql_examples:
    - SELECT city, SUM(sales_amount) FROM sales_summary GROUP BY city
