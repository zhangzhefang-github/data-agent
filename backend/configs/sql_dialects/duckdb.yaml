engine: duckdb
version: "v1."
defaults:
  limit: 500
rules:
  - 用户说出时间时，写成 DATE 'YYYY-MM-DD' 或 date_trunc 条件。
  - 用户没有说出时间时，不添加日期条件。
  - 未写 LIMIT 时使用默认行数上限。
  - 需要先汇总再筛选时，用 WITH 写出子查询。
examples:
  - sql: >
      WITH weekly_sales AS (
        SELECT
          customer_id,
          date_trunc('week', sold_at) AS week,
          SUM(total_price) AS weekly_total
        FROM main.sales_transactions
        WHERE customer_id IS NOT NULL
        GROUP BY customer_id, date_trunc('week', sold_at)
      )
      SELECT DISTINCT customer_id
      FROM weekly_sales
      WHERE weekly_total > 150
